[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ko2-daw"
version = "0.1.0"
description = "KO II / EP-133 MIDI and SysEx workstation"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "generalgroovy" }
]

[project.optional-dependencies]
midi = [
  "mido>=1.3.0",
  "python-rtmidi>=1.5.0"
]
dev = [
  "black>=24.0",
  "ruff>=0.5.0",
  "pytest>=8.0"
]

[project.scripts]
ko2-daw = "ko2_daw.launcher:main"

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
