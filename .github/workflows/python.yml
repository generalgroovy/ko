name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile sources
        run: python -m compileall ko2_daw

      - name: Ruff
        run: ruff check .

      - name: Black
        run: black --check .

      - name: Tests
        run: python -m pytest

      - name: Install screenshot tooling
        run: python -m pip install Pillow

      - name: Sample editor Tk interactions
        run: python tools/check_sample_editor_ui.py

      - name: Local workspace Tk interactions
        run: python tools/check_workspace_ui.py

      - name: Upload sample editor evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ko-sample-editor-ui
          path: docs/evidence/ux-2026-10-07
